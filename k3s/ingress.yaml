# /srv/k3s/infra/pyanimagamification/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pyanima-ingress
  namespace: app
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pyanimagamification.rivendell.local
    - selenium.rivendell.local
    secretName: rivendell-tls
  rules:
  - host: pyanimagamification.rivendell.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pyanima-web-svc
            port:
              number: 5001
  - host: selenium.rivendell.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: selenium-svc
            port:
              number: 7900

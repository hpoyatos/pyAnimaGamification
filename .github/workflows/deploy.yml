name: Deploy pyAnimaGamification to K3s

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-k3s-pyanimagamification
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, lothlorien]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Kubernetes Manifests
        shell: bash
        run: |
          set -e
          echo ">> Aplicando manifestos do Kubernetes (K3s)..."
          
          run_cmd() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              "$@"
            fi
          }

          if command -v kubectl >/dev/null 2>&1; then
            run_cmd kubectl apply -f k3s/app.yaml
            run_cmd kubectl apply -f k3s/selenium.yaml
            run_cmd kubectl apply -f k3s/ingress.yaml
          elif command -v k3s >/dev/null 2>&1; then
            run_cmd k3s kubectl apply -f k3s/app.yaml
            run_cmd k3s kubectl apply -f k3s/selenium.yaml
            run_cmd k3s kubectl apply -f k3s/ingress.yaml
          else
            echo "⚠️ kubectl/k3s não encontrado. Pulando apply de manifestos."
          fi

      - name: Build and Deploy Image to K3s
        shell: bash
        run: |
          chmod +x k3s/build.sh
          ./k3s/build.sh

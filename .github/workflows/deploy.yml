name: Deploy pyAnimaGamification to K3s

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '**.yaml'
      - '**.yml'

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, lothlorien]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Deploy to K3s
        run: |
          chmod +x k3s/build.sh
          ./k3s/build.sh
        
      - name: Apply All Kubernetes Manifests
        run: |
          # Aplica Ingress, Selenium, Service e Deployments
          kubectl apply -f k3s/ || sudo k3s kubectl apply -f k3s/


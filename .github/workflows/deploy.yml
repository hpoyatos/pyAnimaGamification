name: Deploy pyAnimaGamification to K3s

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '**.yaml'
      - '**.yml'

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, lothlorien]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Deploy to K3s
        run: |
          chmod +x k3s/build.sh
          ./k3s/build.sh
        
      - name: Apply All Kubernetes Manifests
        run: |
          # Aplica Ingress, Selenium, Service e Deployments
          if command -v kubectl >/dev/null 2>&1; then
            kubectl apply -f k3s/
          elif command -v k3s >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n k3s kubectl apply -f k3s/
            else
              k3s kubectl apply -f k3s/
            fi
          fi


